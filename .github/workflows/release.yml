name: Release Workflow

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.music-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'

      - name: Restore and validate Android release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          echo "Release keystore restored and alias validated."

      - name: Generate Localization
        run: dart localization/generator.dart

      - name: Set update check flag
        run: echo "const updateCheckFlag = true;" > lib/utils/update_check_flag_file.dart

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build Architecture Specific APKs
        run: flutter build apk --target-platform android-arm,android-arm64,android-x64 --split-per-abi --release

      - name: Verify generated APKs and release signatures
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          test -s "$APK_DIR/app-release.apk"
          test -s "$APK_DIR/app-armeabi-v7a-release.apk"
          test -s "$APK_DIR/app-arm64-v8a-release.apk"
          test -s "$APK_DIR/app-x86_64-release.apk"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for apk in "$APK_DIR"/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done
          echo "All APKs exist and pass Android signature verification."

      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  package-android:
    name: Package and verify Android release assets
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: downloaded-apks

      - name: Organize APKs and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION=${GITHUB_REF_NAME#v}
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then VERSION="latest"; fi
          find downloaded-apks -type f -name "*.apk" -exec cp {} release-assets/ \;
          cd release-assets
          if [ -f "app-armeabi-v7a-release.apk" ]; then mv app-armeabi-v7a-release.apk "muziinap-${VERSION}-armeabi-v7a.apk"; fi
          if [ -f "app-arm64-v8a-release.apk" ]; then mv app-arm64-v8a-release.apk "muziinap-${VERSION}-arm64-v8a.apk"; fi
          if [ -f "app-x86_64-release.apk" ]; then mv app-x86_64-release.apk "muziinap-${VERSION}-x86_64.apk"; fi
          if [ -f "app-release.apk" ]; then mv app-release.apk "muziinap-${VERSION}.apk"; fi
          test -s "muziinap-${VERSION}.apk"
          test -s "muziinap-${VERSION}-armeabi-v7a.apk"
          test -s "muziinap-${VERSION}-arm64-v8a.apk"
          test -s "muziinap-${VERSION}-x86_64.apk"
          sha256sum *.apk > "muziinap-v${VERSION}.sha256sum"
          sha256sum -c "muziinap-v${VERSION}.sha256sum"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: release-assets/*
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [package-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -n "$(find . -maxdepth 1 -name '*.apk' -type f -print -quit)"
          checksum_file="$(find . -maxdepth 1 -name '*.sha256sum' -type f -print -quit)"
          test -n "$checksum_file"
          sha256sum -c "$checksum_file"

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          draft: false
          generate_release_notes: true
