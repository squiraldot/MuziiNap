name: MuziiNap Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MuziiNap release APK
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.music-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify pinned Flutter submodule
        env:
          FLUTTER_COMMIT: 84abdf7372654171e0a66174be2846f53331f6ab
        run: |
          test "$(git -C flutter rev-parse HEAD)" = "$FLUTTER_COMMIT"
          git -C flutter show -s --format='%H %s' HEAD

      - name: Verify Android application package
        shell: bash
        run: |
          test -f android/app/src/main/kotlin/com/merrmist/muziinapmusic/MainActivity.kt
          grep -Fx 'package com.merrmist.muziinapmusic' android/app/src/main/kotlin/com/merrmist/muziinapmusic/MainActivity.kt
          grep -F 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml
          grep -F 'applicationId "com.merrmist.muziinapmusic"' android/app/build.gradle

      - name: Restore and validate Android release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          echo "Release keystore restored and alias validated."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Repair and install Android NDK with retries
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"

          # A transient/corrupt SDK download can leave a non-ZIP NDK archive
          # cached by sdkmanager. Remove partial state before retrying.
          rm -rf "$SDK_ROOT/ndk/27.0.12077973" "$HOME/.android/cache"
          for attempt in 1 2 3; do
            echo "Installing NDK 27.0.12077973 (attempt $attempt/3)"
            if yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;27.0.12077973"; then
              test -x "$SDK_ROOT/ndk/27.0.12077973/ndk-build"
              echo "NDK 27.0.12077973 installed and verified."
              exit 0
            fi
            rm -rf "$SDK_ROOT/ndk/27.0.12077973" "$HOME/.android/cache"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "NDK installation failed after 3 attempts." >&2
          exit 1

      - name: Generate localization
        run: dart localization/generator.dart

      - name: Enable startup update check for GitHub APK
        run: echo "const updateCheckFlag = true;" > lib/utils/update_check_flag_file.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos lib test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK and release signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK passed Android signature verification."
          ls -lh "$APK"

      - name: Upload MuziiNap APK
        uses: actions/upload-artifact@v7
        with:
          name: muziinap-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
