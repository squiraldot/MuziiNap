group 'com.ryanheise.just_audio'
version '1.0-SNAPSHOT'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.11.1' }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.ryanheise.just_audio'
    compileSdk 35
    defaultConfig { minSdk 16 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def exoplayerVersion = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$exoplayerVersion"
    implementation "androidx.media3:media3-exoplayer-dash:$exoplayerVersion"
    implementation "androidx.media3:media3-exoplayer-hls:$exoplayerVersion"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:$exoplayerVersion"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
