name: Android Build & Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.music-release.jks
      SYMBOLS_ENCRYPTION_KEY: ${{ secrets.SYMBOLS_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'

      - name: Restore and validate Android release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          RELEASE_CERT_SHA256="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sha256sum | awk '{print toupper($1)}')"
          [[ "$RELEASE_CERT_SHA256" =~ ^[A-F0-9]{64}$ ]]
          echo "ANDROID_EXPECTED_CERT_SHA256=$RELEASE_CERT_SHA256" >> "$GITHUB_ENV"
          echo "Release keystore restored and alias validated."

      - name: Generate Localization
        run: dart localization/generator.dart

      - name: Set update check flag
        run: echo "const updateCheckFlag = true;" > lib/utils/update_check_flag_file.dart

      - name: Get Dependencies
        run: flutter pub get
      - name: Generate Isar collection schemas
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare unique release build identity
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(awk -F': ' '$1 == "version" {print $2; exit}' pubspec.yaml)"
          test -n "$APP_VERSION"
          BUILD_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SYMBOLS_DIR="build/obfuscation-symbols/${GITHUB_SHA}/${APP_VERSION}/${BUILD_ID}"
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "BUILD_ID=$BUILD_ID"
            echo "SYMBOLS_DIR=$SYMBOLS_DIR"
          } >> "$GITHUB_ENV"

      - name: Build obfuscated Universal APK
        run: flutter build apk --release --obfuscate --split-debug-info="$SYMBOLS_DIR/universal"

      - name: Preserve universal R8 mapping
        shell: bash
        run: |
          set -euo pipefail
          MAPPING="build/app/outputs/mapping/release/mapping.txt"
          test -s "$MAPPING" || { echo "::error::Universal R8 mapping.txt was not generated."; exit 1; }
          mkdir -p "$SYMBOLS_DIR/r8/universal"
          cp "$MAPPING" "$SYMBOLS_DIR/r8/universal/mapping.txt"

      - name: Build obfuscated Architecture Specific APKs
        run: flutter build apk --target-platform android-arm,android-arm64,android-x64 --split-per-abi --release --obfuscate --split-debug-info="$SYMBOLS_DIR/split-per-abi"

      - name: Preserve split-ABI R8 mapping
        shell: bash
        run: |
          set -euo pipefail
          MAPPING="build/app/outputs/mapping/release/mapping.txt"
          test -s "$MAPPING" || { echo "::error::Split-ABI R8 mapping.txt was not generated."; exit 1; }
          mkdir -p "$SYMBOLS_DIR/r8/split-per-abi"
          cp "$MAPPING" "$SYMBOLS_DIR/r8/split-per-abi/mapping.txt"

      - name: Verify generated APKs and release signatures
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          test -s "$APK_DIR/app-release.apk"
          test -s "$APK_DIR/app-armeabi-v7a-release.apk"
          test -s "$APK_DIR/app-arm64-v8a-release.apk"
          test -s "$APK_DIR/app-x86_64-release.apk"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          EXPECTED_CERT="$ANDROID_EXPECTED_CERT_SHA256"
          for apk in "$APK_DIR"/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
            ACTUAL_CERT="$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            test "$ACTUAL_CERT" = "$EXPECTED_CERT" || { echo "::error::Unexpected APK signer."; exit 1; }
            if unzip -Z1 "$apk" | grep -Eq '(^|/)[^/]+\.symbols$'; then
              echo "::error::Dart symbol files must not be packaged inside $apk."
              exit 1
            fi
          done
          echo "All APKs exist, pass Android signature verification, and contain no Dart symbol files."

      - name: Encrypt and verify Dart AOT symbols
        shell: bash
        env:
          SYMBOLS_ENCRYPTION_KEY: ${{ secrets.SYMBOLS_ENCRYPTION_KEY }}
        run: bash scripts/ci/package_obfuscation_symbols.sh "$SYMBOLS_DIR" build/secure-symbols

      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload encrypted Dart AOT symbols
        uses: actions/upload-artifact@v4
        with:
          name: muziinap-obfuscated-symbols-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/secure-symbols/*.gpg
          if-no-files-found: error
          retention-days: 90

  package-android:
    name: Package and verify Android build assets
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: downloaded-apks

      - name: Organize APKs and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-assets
          VERSION="$(awk -F': ' '$1 == "version" {print $2; exit}' pubspec.yaml)"
          test -n "$VERSION"
          find downloaded-apks -type f -name "*.apk" -exec cp {} build-assets/ \;
          cd build-assets
          if [ -f "app-armeabi-v7a-release.apk" ]; then mv app-armeabi-v7a-release.apk "muziinap-${VERSION}-armeabi-v7a.apk"; fi
          if [ -f "app-arm64-v8a-release.apk" ]; then mv app-arm64-v8a-release.apk "muziinap-${VERSION}-arm64-v8a.apk"; fi
          if [ -f "app-x86_64-release.apk" ]; then mv app-x86_64-release.apk "muziinap-${VERSION}-x86_64.apk"; fi
          if [ -f "app-release.apk" ]; then mv app-release.apk "muziinap-${VERSION}.apk"; fi
          test -s "muziinap-${VERSION}.apk"
          test -s "muziinap-${VERSION}-armeabi-v7a.apk"
          test -s "muziinap-${VERSION}-arm64-v8a.apk"
          test -s "muziinap-${VERSION}-x86_64.apk"
          sha256sum *.apk > "muziinap-v${VERSION}.sha256sum"
          sha256sum -c "muziinap-v${VERSION}.sha256sum"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: build-assets/*
          if-no-files-found: error
