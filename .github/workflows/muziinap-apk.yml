name: MuziiNap Android APK

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MuziiNap release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.music-release.jks
      ANDROID_TRUSTED_CERT_SHA256S: ${{ vars.ANDROID_TRUSTED_CERT_SHA256S }}
      SYMBOLS_ENCRYPTION_KEY: ${{ secrets.SYMBOLS_ENCRYPTION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify pinned Flutter submodule
        env:
          FLUTTER_COMMIT: 84abdf7372654171e0a66174be2846f53331f6ab
        run: |
          test "$(git -C flutter rev-parse HEAD)" = "$FLUTTER_COMMIT"
          git -C flutter show -s --format='%H %s' HEAD

      - name: Verify Android application package
        shell: bash
        run: |
          test -f android/app/src/main/kotlin/com/merrmist/muziinapmusic/MainActivity.kt
          grep -Fx 'package com.merrmist.muziinapmusic' android/app/src/main/kotlin/com/merrmist/muziinapmusic/MainActivity.kt
          grep -F 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml
          grep -F 'applicationId "com.merrmist.muziinapmusic"' android/app/build.gradle

      - name: Restore and validate Android release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          RELEASE_CERT_SHA256="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sha256sum | awk '{print toupper($1)}')"
          [[ "$RELEASE_CERT_SHA256" =~ ^[A-F0-9]{64}$ ]]
          echo "ANDROID_EXPECTED_CERT_SHA256=$RELEASE_CERT_SHA256" >> "$GITHUB_ENV"
          echo "Release keystore restored; SHA-256 certificate fingerprint derived."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Free unused runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleanup:"
          df -h /

      - name: Repair and install Android NDK with retries
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"

          NDK_DIR="$SDK_ROOT/ndk/27.0.12077973"
          # Clear stale SDK Manager downloads and partial NDK extraction.
          rm -rf "$SDK_ROOT/ndk" "$SDK_ROOT/.temp" "$SDK_ROOT/.downloadIntermediates" "$HOME/.android/cache"

          # Accept licenses separately. Do not use pipefail for the 'yes'
          # producer: sdkmanager can close stdin early after accepting input,
          # which makes yes exit with SIGPIPE even when sdkmanager succeeds.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          for attempt in 1 2 3; do
            echo "Installing NDK 27.0.12077973 (attempt $attempt/3)"
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;27.0.12077973"; then
              if [ -f "$NDK_DIR/source.properties" ] && [ -x "$NDK_DIR/ndk-build" ]; then
                grep -F "Pkg.Revision = 27.0.12077973" "$NDK_DIR/source.properties"
                echo "NDK 27.0.12077973 installed and verified."
                exit 0
              fi
              echo "::warning::sdkmanager returned success but NDK files are incomplete."
            else
              echo "::warning::sdkmanager failed on attempt $attempt."
            fi

            rm -rf "$NDK_DIR" "$SDK_ROOT/.temp" "$SDK_ROOT/.downloadIntermediates" "$HOME/.android/cache"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done

          echo "::error::NDK installation failed after 3 clean attempts." >&2
          exit 1

      - name: Generate localization
        run: dart localization/generator.dart

      - name: Enable startup update check for GitHub APK
        run: echo "const updateCheckFlag = true;" > lib/utils/update_check_flag_file.dart

      - name: Get dependencies
        run: flutter pub get
      - name: Generate Isar collection schemas
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos lib test

      - name: Prepare unique release build identity
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(awk -F': ' '$1 == "version" {print $2; exit}' pubspec.yaml)"
          test -n "$APP_VERSION"
          BUILD_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SYMBOLS_DIR="build/obfuscation-symbols/${GITHUB_SHA}/${APP_VERSION}/${BUILD_ID}"
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "BUILD_ID=$BUILD_ID"
            echo "SYMBOLS_DIR=$SYMBOLS_DIR"
          } >> "$GITHUB_ENV"

      - name: Build obfuscated and R8-hardened release APK
        run: flutter build apk --release --obfuscate --split-debug-info="$SYMBOLS_DIR/universal"

      - name: Preserve R8 mapping for this build
        shell: bash
        run: |
          set -euo pipefail
          MAPPING="build/app/outputs/mapping/release/mapping.txt"
          test -s "$MAPPING" || { echo "::error::R8 mapping.txt was not generated."; exit 1; }
          mkdir -p "$SYMBOLS_DIR/r8/universal"
          cp "$MAPPING" "$SYMBOLS_DIR/r8/universal/mapping.txt"
          test -s "$SYMBOLS_DIR/r8/universal/mapping.txt"

      - name: Verify APK and release signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          EXPECTED_CERT="$(printf '%s' "$ANDROID_EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]')"
          ACTUAL_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || { echo "::error::APK signer does not match the CI release keystore."; exit 1; }
          if unzip -Z1 "$APK" | grep -Eq '(^|/)[^/]+\.symbols
            echo "::error::Dart symbol files must not be packaged inside the APK."
            exit 1
          fi
          echo "APK passed Android signature verification and contains no Dart symbol files."
          ls -lh "$APK"

      - name: Capture and verify native symbols
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          NATIVE_SYMBOLS="build/app/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          test -s "$APK"
          test -s "$NATIVE_SYMBOLS" || { echo "::error::AGP native-debug-symbols.zip is missing or empty."; exit 1; }

          APK_ABIS="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && NF == 3 && $3 ~ /\.so$/ { print $2 }' | sort -u)"
          test -n "$APK_ABIS" || { echo "::error::No native Android ABI libraries found in the release APK."; exit 1; }
          SYMBOL_ENTRIES="$(unzip -Z1 "$NATIVE_SYMBOLS")"
          printf '%s\n' "$SYMBOL_ENTRIES" | grep -Eq '(^|/)[^/]+\.dbg$' || {
            echo "::error::Native symbols archive contains no extracted .dbg files (a dependency may already be stripped)."
            exit 1
          }

          for abi in $APK_ABIS; do
            printf '%s\n' "$SYMBOL_ENTRIES" | grep -Eq "(^|/)${abi}/.*\.dbg$" || {
              echo "::error::No native debug symbols captured for APK ABI: $abi"
              exit 1
            }
          done

          mkdir -p "$SYMBOLS_DIR/native"
          cp "$NATIVE_SYMBOLS" "$SYMBOLS_DIR/native/native-debug-symbols.zip"
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit SHA: $GITHUB_SHA"
            echo "App version: $APP_VERSION"
            echo "Build ID: $BUILD_ID"
            echo "NDK: 27.0.12077973"
            echo "Android Gradle Plugin: 8.11.1"
            echo "Debug symbol level: FULL"
            echo
            echo "Packaged ABIs:"
            printf '%s\n' "$APK_ABIS"
            echo
            echo "Packaged native libraries:"
            unzip -Z1 "$APK" | grep -E '^lib/.+\.so$' || true
            echo
            echo "Captured native debug-symbol entries:"
            printf '%s\n' "$SYMBOL_ENTRIES" | grep -E '(^|/)[^/]+\.dbg$'
          } > "$SYMBOLS_DIR/native/native-symbols-manifest.txt"
          test -s "$SYMBOLS_DIR/native/native-symbols-manifest.txt"
          echo "Native debug symbols verified for all APK ABIs: $APK_ABIS"

      - name: Encrypt and verify Dart AOT symbols
        shell: bash
        env:
          SYMBOLS_ENCRYPTION_KEY: ${{ secrets.SYMBOLS_ENCRYPTION_KEY }}
        run: bash scripts/ci/package_obfuscation_symbols.sh "$SYMBOLS_DIR" build/secure-symbols

      - name: Upload MuziiNap APK
        uses: actions/upload-artifact@v7
        with:
          name: muziinap-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload encrypted Dart, R8 and native symbols
        uses: actions/upload-artifact@v7
        with:
          name: muziinap-private-symbols-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/secure-symbols/*.gpg
          if-no-files-found: error
          retention-days: 90
; then
            echo "::error::Dart symbol files must not be packaged inside the APK."
            exit 1
          fi
          echo "APK passed Android signature verification and contains no Dart symbol files."
          ls -lh "$APK"

      - name: Capture and verify native symbols
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          NATIVE_SYMBOLS="build/app/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          test -s "$APK"
          test -s "$NATIVE_SYMBOLS" || { echo "::error::AGP native-debug-symbols.zip is missing or empty."; exit 1; }

          APK_ABIS="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && NF == 3 && $3 ~ /\.so$/ { print $2 }' | sort -u)"
          test -n "$APK_ABIS" || { echo "::error::No native Android ABI libraries found in the release APK."; exit 1; }
          SYMBOL_ENTRIES="$(unzip -Z1 "$NATIVE_SYMBOLS")"
          printf '%s\n' "$SYMBOL_ENTRIES" | grep -Eq '(^|/)[^/]+\.dbg$' || {
            echo "::error::Native symbols archive contains no extracted .dbg files (a dependency may already be stripped)."
            exit 1
          }

          for abi in $APK_ABIS; do
            printf '%s\n' "$SYMBOL_ENTRIES" | grep -Eq "(^|/)${abi}/.*\.dbg$" || {
              echo "::error::No native debug symbols captured for APK ABI: $abi"
              exit 1
            }
          done

          mkdir -p "$SYMBOLS_DIR/native"
          cp "$NATIVE_SYMBOLS" "$SYMBOLS_DIR/native/native-debug-symbols.zip"
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit SHA: $GITHUB_SHA"
            echo "App version: $APP_VERSION"
            echo "Build ID: $BUILD_ID"
            echo "NDK: 27.0.12077973"
            echo "Android Gradle Plugin: 8.11.1"
            echo "Debug symbol level: FULL"
            echo
            echo "Packaged ABIs:"
            printf '%s\n' "$APK_ABIS"
            echo
            echo "Packaged native libraries:"
            unzip -Z1 "$APK" | grep -E '^lib/.+\.so$' || true
            echo
            echo "Captured native debug-symbol entries:"
            printf '%s\n' "$SYMBOL_ENTRIES" | grep -E '(^|/)[^/]+\.dbg$'
          } > "$SYMBOLS_DIR/native/native-symbols-manifest.txt"
          test -s "$SYMBOLS_DIR/native/native-symbols-manifest.txt"
          echo "Native debug symbols verified for all APK ABIs: $APK_ABIS"

      - name: Encrypt and verify Dart AOT symbols
        shell: bash
        env:
          SYMBOLS_ENCRYPTION_KEY: ${{ secrets.SYMBOLS_ENCRYPTION_KEY }}
        run: bash scripts/ci/package_obfuscation_symbols.sh "$SYMBOLS_DIR" build/secure-symbols

      - name: Upload MuziiNap APK
        uses: actions/upload-artifact@v7
        with:
          name: muziinap-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload encrypted Dart, R8 and native symbols
        uses: actions/upload-artifact@v7
        with:
          name: muziinap-private-symbols-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/secure-symbols/*.gpg
          if-no-files-found: error
          retention-days: 90
