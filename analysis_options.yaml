# Flutter baseline with strict async and resource-safety checks.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    avoid_print: error
    close_sinks: error
  exclude:
    - build/**
    - android/**

linter:
  rules:
    avoid_print: true
    close_sinks: true
    unawaited_futures: true
    # Preserve the repository's established relative-import convention.
    avoid_relative_lib_imports: false
