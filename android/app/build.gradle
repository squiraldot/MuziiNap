plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}
def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningConfigured = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

android {
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    buildFeatures { buildConfig true }

    def trustedReleaseCertFingerprints = (System.getenv('ANDROID_EXPECTED_CERT_SHA256') ?: '')
        .replaceAll('[^A-Fa-f0-9]', '')
        .toUpperCase()
    if (trustedReleaseCertFingerprints && !(trustedReleaseCertFingerprints ==~ /[A-F0-9]{64}/)) {
        throw new GradleException('ANDROID_EXPECTED_CERT_SHA256 must be a SHA-256 certificate fingerprint.')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Keep the application ID stable so existing installs can update in place.
        applicationId "com.merrmist.muziinapmusic"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        buildConfigField 'String', 'TRUSTED_RELEASE_CERT_SHA256S', "\"${trustedReleaseCertFingerprints}\""
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Local release builds retain the existing debug-signing fallback when
            // release credentials are absent. CI validates and supplies release signing.
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            // Keep full native debug metadata in a separate AGP symbols archive.
            // The APK remains stripped; CI encrypts the archive with the private symbols bundle.
            ndk { debugSymbolLevel 'FULL' }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    namespace 'com.merrmist.muziinapmusic'
}

flutter {
    source '../..'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.android.support:multidex:2.0.1'
    implementation 'androidx.core:core-splashscreen:1.0.0-beta02'
    implementation 'org.apache.commons:commons-compress:1.27.1'
}
