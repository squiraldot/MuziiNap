name: just_audio
description: MuziiNap-maintained Android playback fork of just_audio 0.10.6.
version: 0.10.6+muziinap.1
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"
dependencies:
  just_audio_platform_interface: ^4.6.0
  just_audio_web: ^0.4.15
  audio_session: ">=0.1.24 <0.3.0"
  rxdart: ">=0.26.0 <0.29.0"
  path: ^1.8.0
  path_provider: ^2.0.0
  async: ^2.5.0
  uuid: ">=3.0.1 <5.0.0"
  crypto: ^3.0.0
  meta: ^1.3.0
  flutter:
    sdk: flutter
  synchronized: ^3.2.0
flutter:
  plugin:
    platforms:
      android:
        package: com.ryanheise.just_audio
        pluginClass: JustAudioPlugin
      web:
        default_package: just_audio_web
