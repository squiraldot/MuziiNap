name: Temporary APK Upgrade Emulator Test

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: temporary-apk-upgrade-emulator-test
  cancel-in-progress: false

jobs:
  beta-to-production-upgrade:
    name: Latest beta to v1.0.0 upgrade (Android 13)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest beta APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/beta artifacts/production test-results
          gh run download 43700640883 \
            --repo "$GITHUB_REPOSITORY" \
            --name muziinap-release-apk \
            --dir artifacts/beta

      - name: Download v1.0.0 APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43702318078 \
            --repo "$GITHUB_REPOSITORY" \
            --name muziinap-release-apk \
            --dir artifacts/production

      - name: Locate and validate APK artifacts
        id: apks
        shell: bash
        run: |
          set -euo pipefail

          BETA_APK="$(find artifacts/beta -type f -name '*.apk' -print -quit)"
          PRODUCTION_APK="$(find artifacts/production -type f -name '*.apk' -print -quit)"

          test -n "$BETA_APK" || { echo "::error::Beta APK not found in workflow run 43700640883."; exit 1; }
          test -n "$PRODUCTION_APK" || { echo "::error::Production APK not found in workflow run 43702318078."; exit 1; }

          echo "beta_apk=$GITHUB_WORKSPACE/$BETA_APK" >> "$GITHUB_OUTPUT"
          echo "production_apk=$GITHUB_WORKSPACE/$PRODUCTION_APK" >> "$GITHUB_OUTPUT"

          ls -lh "$BETA_APK" "$PRODUCTION_APK"

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install beta and test in-place production upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/test-apk-upgrade.sh

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: muziinap-apk-upgrade-emulator-diagnostics
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
