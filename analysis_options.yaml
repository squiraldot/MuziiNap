# Shared Flutter lints plus strict rules for resource and async safety.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    avoid_print: error
    close_sinks: error
    unawaited_futures: error
  exclude:
    - build/**
    - android/**

linter:
  rules:
    # Streaming and background-task resource safety.
    avoid_print: true
    close_sinks: true
    unawaited_futures: true
    cancel_subscriptions: true
    discarded_futures: true
    # Keep the existing legacy relative-import convention.
    avoid_relative_lib_imports: false
    # Predictable, allocation-conscious Dart style.
    avoid_slow_async_io: true
    prefer_final_locals: true
