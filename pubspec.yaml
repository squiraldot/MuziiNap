# Dart package identifier used by this app's internal package imports.
name: muziinap
description: Android-only music streaming app.
# The following line prevents the package from accidentally being published.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.1.5 <4.0.0"

dependencies:
  animations: ^2.0.11
  app_links: ^3.5.1
  archive: ^3.1.6
  audio_service: ^0.18.17
  audio_video_progress_bar: ^2.0.3
  audiotags: ^1.4.1
  buttons_tabbar: ^1.3.13
  dio: ^5.7.0
  file_picker: ^8.0.6
  flutter:
    sdk: flutter
  flutter_keyboard_visibility: ^6.0.0
  flutter_lyric: ^2.0.4+6
  flutter_slidable: ^3.1.2
  get: ^4.7.1
  google_fonts: ^6.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  html: ^0.15.6
  jni: ^0.14.0
  just_audio: ^0.10.6
  palette_generator: ^0.3.3+4
  path: ^1.8.3
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  share_plus: ^10.1.4
  package_info_plus: ^8.0.0
  wakelock_plus: ^1.3.3
  shimmer: ^3.0.0
  sidebar_with_animation:
    git:
      url: https://github.com/anandnet/animated_side_bar.git
      branch: main
      ref: b53567a42b4ba3793a3cf00d478bdba0ecce33d7
  toggle_switch: ^2.1.0
  url_launcher: ^6.2.1
  widget_marquee: ^0.0.8
  youtube_explode_dart:
    git:
      url: https://github.com/its-ashutosh-pathak/youtube_explode_dart.git
      ref: fix-visionos-403
  qr_flutter: ^4.1.0
  flutter_zxing: ^2.3.0
  camera: ^0.12.0+1
  http: ^1.6.0
  flutter_js: ^0.8.7
  webview_flutter: ^4.14.1
  crypto: ^3.0.7
  image: ^4.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  jnigen: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: 'Bold'
      fonts:
        - asset: assets/fonts/Bold.ttf
    - family: 'Classic'
      fonts:
        - asset: assets/fonts/Classic.ttf
    - family: 'Directional'
      fonts:
        - asset: assets/fonts/Directional.ttf
    - family: 'Elegant'
      fonts:
        - asset: assets/fonts/Elegant.otf
    - family: 'Gujarati Bold'
      fonts:
        - asset: assets/fonts/Gujarati Bold.ttf
    - family: 'Gujarati Thin'
      fonts:
        - asset: assets/fonts/Gujarati Thin.ttf
    - family: 'Hindi Bold'
      fonts:
        - asset: assets/fonts/Hindi Bold.ttf
    - family: 'Hindi Thin'
      fonts:
        - asset: assets/fonts/Hindi Thin.ttf
    - family: 'Journal'
      fonts:
        - asset: assets/fonts/Journal.ttf
    - family: 'Meme'
      fonts:
        - asset: assets/fonts/Meme.ttf
    - family: 'Modern'
      fonts:
        - asset: assets/fonts/Modern.ttf
    - family: 'Neon'
      fonts:
        - asset: assets/fonts/Neon.otf
    - family: 'PermanentMaker'
      fonts:
        - asset: assets/fonts/PermanentMaker.ttf
    - family: 'Rosalia'
      fonts:
        - asset: assets/fonts/Rosalia.ttf
    - family: 'SFProDisplay'
      fonts:
        - asset: assets/fonts/SFProDisplay.ttf
    - family: 'SFProMedium'
      fonts:
        - asset: assets/fonts/SFProMedium.ttf
    - family: 'Strong'
      fonts:
        - asset: assets/fonts/Strong.ttf
    - family: 'Typewriter'
      fonts:
        - asset: assets/fonts/Typewriter.ttf
    - family: 'iOS Bold'
      fonts:
        - asset: assets/fonts/iOS Bold.ttf
    - family: 'iOS Comic Sans'
      fonts:
        - asset: assets/fonts/iOS Comic Sans.ttf
    - family: 'iOS Cursive italic'
      fonts:
        - asset: assets/fonts/iOS Cursive italic.ttf
    - family: 'iOS Hindi Bold'
      fonts:
        - asset: assets/fonts/iOS Hindi Bold.ttf
    - family: 'iOS Hindi Light'
      fonts:
        - asset: assets/fonts/iOS Hindi Light.ttf
    - family: 'iOS New Money'
      fonts:
        - asset: assets/fonts/iOS New Money.ttf
    - family: 'literature'
      fonts:
        - asset: assets/fonts/literature.ttf
  # Use MuziiNap's maintained Android PCM-processor fork of just_audio.
dependency_overrides:
  just_audio:
    path: packages/just_audio
