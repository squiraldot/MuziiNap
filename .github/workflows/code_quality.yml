name: Code quality check # branch validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check the source code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'
      - name: Install packages
        run: flutter pub get
      - name: Compile Android debug APK
        run: flutter build apk --debug
      - name: Native DSP unit tests
        run: gradle -p android :app:testDebugUnitTest :just_audio:testDebugUnitTest --no-daemon
      - name: Linter
        run: flutter analyze --no-fatal-infos lib test
      - name: Strict analyzer for updated files
        run: flutter analyze --fatal-infos lib/services/equalizer.dart lib/services/local_proxy.dart test/equalizer_apply_gate_test.dart
      - name: Tests
        run: flutter test --no-pub
